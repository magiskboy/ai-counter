# Default sandbox config (copied to ~/.sandbox-ai-counter by ./install.sh).
# Add your git repos under projects/ and list them below.

automation:
  user_messages_per_conversation: 2
  delay_between_messages_seconds: 20
  delay_between_conversations_seconds: 45

skills:
  agent: cursor
  yes: true
  default_repo: https://github.com/obra/superpowers
  global_packages:
    - repo: https://github.com/obra/superpowers
      skills:
        - brainstorming
    - repo: https://github.com/mohitmishra786/low-level-dev-skills
      skills:
        - linux-perf
    - repo: https://github.com/affaan-m/everything-claude-code
      skills:
        - cpp-coding-standards

sandbox:
  projects_dir: projects
  projects:
    - name: wrk
      conversations_per_day: 7
      user_messages_per_conversation: 4
      skills: [systematic-debugging, cpp-coding-standards, linux-perf]

cursor:
  binary: cursor-agent
  flags:
    - "-p"
    - "--trust"
    - "-f"
    - "--approve-mcps"
  timeout_seconds: 900
  delay_between_sessions: 45

z8l:
  binary: /usr/local/bin/z8l
  sync_provider: cursor

# Cron 06:30 Mon–Fri, timezone Asia/Ho_Chi_Minh (fixed in container, not configurable).
schedule:
  cron: "30 6 * * 1-5"

# Relative to sandbox HOME; loaded at runtime (not in Docker image).
prompts:
  file: /opt/ai-counter/prompts/daily.yaml
  rotate: daily
